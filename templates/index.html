<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Numpad</title>
    <style>
        body {
            margin: 0;
            background-color: #000;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .code-display {
            font-size: 5vh;
            letter-spacing: 1vw;
            margin-bottom: 2vh;
            color: #0f0;
        }

        #errorMsg {
            font-size: 2.5vh;
            color: #f00;
            opacity: 0;
            transition: opacity 0.5s ease;
            margin-bottom: 2vh;
        }

        .numpad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1vh;
            width: 90vw;
        }

            .numpad button {
                font-size: 5vh;
                padding: 4vh 0;
                background: #222;
                color: #0f0;
                border: 2px solid #0f0;
                border-radius: 10px;
                touch-action: manipulation;
            }

                .numpad button:active {
                    background: #0f0;
                    color: #000;
                }
    </style>
</head>
<body>
    <div class="code-display" id="codeDisplay">____</div>
    <div id="errorMsg"></div>
    <div class="numpad">
        {% for row in [[1,2,3],[4,5,6],[7,8,9],['←',0,'SEND']] %}
        {% for key in row %}
        <button onclick="press('{{ key }}')">{{ key }}</button>
        {% endfor %}
        {% endfor %}
    </div>

    <script>
        let code = "";

        function press(key) {
            if (key === '←') {
                code = code.slice(0, -1);
            } else if (key === 'SEND') {
                if (code.length < 4) {
                    showMessage("Code Must Be 4 Digits", false);
                    return;
                }

                fetch("/submit", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ code: code })
                })
                    .then(response => {
                        if (response.status === 200) {
                            showMessage("✅ Code Accepted", true);
                            code = "";
                        } else if (response.status === 404 || response.status == 401) {
                            showMessage("❌ Invalid Code", false);
                        } else {
                            showMessage("🚨 Server Error", false);
                        }
                        updateDisplay();
                    })
                    .catch(error => {
                        showMessage("❌ Connection Error", false);
                    });

            } else if (code.length < 4) {
                code += key;
            }

            updateDisplay();
        }

        function updateDisplay() {
            document.getElementById("codeDisplay").textContent = code.padEnd(4, '_');
        }

        function showMessage(message, success = false) {
            const errorDiv = document.getElementById("errorMsg");
            errorDiv.textContent = message;
            errorDiv.style.color = success ? "#0f0" : "#f00";
            errorDiv.style.opacity = 1;
            setTimeout(() => {
                errorDiv.style.opacity = 0;
            }, 3000);
        }
    </script>
</body>
</html>
