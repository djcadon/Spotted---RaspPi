<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Numpad</title>
    <style>
        body {
            margin: 0;
            background-color: #000;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .code-display {
            font-size: 5vh;
            letter-spacing: 1vw;
            margin-bottom: 2vh;
            color: #0f0;
        }

        .numpad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1vh;
            width: 90vw;
        }

            .numpad button {
                font-size: 5vh;
                padding: 4vh 0;
                background: #222;
                color: #0f0;
                border: 2px solid #0f0;
                border-radius: 10px;
                touch-action: manipulation;
            }

                .numpad button:active {
                    background: #0f0;
                    color: #000;
                }

        .controls {
            margin-top: 2vh;
            display: flex;
            gap: 2vw;
        }

            .controls button {
                font-size: 4vh;
                padding: 2vh 4vw;
            }
    </style>
</head>
<body>
    <div class="code-display" id="codeDisplay">____</div>
    <div class="numpad">
        {% for row in [[1,2,3],[4,5,6],[7,8,9],['←',0,'OK']] %}
        {% for key in row %}
        <button onclick="press('{{ key }}')">{{ key }}</button>
        {% endfor %}
        {% endfor %}
    </div>

    <script>
        let code = "";

        function press(key) {
            if (key === '←') {
                code = code.slice(0, -1);
            } else if (key === 'OK') {
                if (code.length === 4) {
                    fetch("/submit", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ code: code })
                    }).then(() => {
                        code = "";
                    });
                }
            } else if (code.length < 4) {
                code += key;
            }

            updateDisplay();
        }

        function updateDisplay() {
            document.getElementById("codeDisplay").textContent = code.padEnd(4, '_');
        }
    </script>
</body>
</html>
